[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starcg-bot"
version = "0.1.0"
description = "Python ADB + YOLO automation scaffold for LDPlayer-based StarCG workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adbutils>=2.8.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pyserial>=3.5",
    "ultralytics>=8.2.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.0.0"]

[project.scripts]
starcg-bot = "starcg_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
